<body>
  <div class="hint-box" id="hintBox">
    <h1>Chạm vào màn hình</h1>
    <p>Bấm hoặc chạm bất kỳ đâu để mở form nhập thông tin</p>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="card" id="formCard">
      <div class="card-header">
        <h2>Nhập thông tin</h2>
        <button class="close-btn" id="closeBtn" type="button">Đóng</button>
      </div>

      <form id="infoForm">
        <input id="nameInput" type="text" placeholder="Tên hoặc biệt danh" />
        <input id="contactInput" type="text" placeholder="Số điện thoại / Liên hệ" />
        <textarea id="messageInput" placeholder="Nội dung hoặc ghi chú..."></textarea>

        <div class="actions">
          <button class="btn-submit" id="submitBtn" type="submit">Gửi thông tin</button>
          <button class="btn-view" id="viewBtn" type="button">Xem đã gửi</button>
        </div>
      </form>

      <div id="status"></div>
      <div class="submissions-list" id="submissionsList"></div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const formCard = document.getElementById('formCard');
    const closeBtn = document.getElementById('closeBtn');
    const infoForm = document.getElementById('infoForm');
    const nameInput = document.getElementById('nameInput');
    const contactInput = document.getElementById('contactInput');
    const messageInput = document.getElementById('messageInput');
    const submitBtn = document.getElementById('submitBtn');
    const viewBtn = document.getElementById('viewBtn');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('submissionsList');

    function openModal() {
      modal.classList.add('open');
      statusEl.textContent = '';
      setTimeout(() => nameInput.focus(), 50);
    }

    function closeModal() {
      modal.classList.remove('open');
    }

    // Chạm/click vào màn hình khi form đang đóng sẽ mở form
    document.addEventListener('pointerdown', (e) => {
      if (!modal.classList.contains('open')) {
        openModal();
      } else if (e.target === modal) {
        closeModal();
      }
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeModal();
    });

    infoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.className = '';

      const payload = {
        name: nameInput.value.trim(),
        contact: contactInput.value.trim(),
        message: messageInput.value.trim(),
      };

      if (!payload.name && !payload.contact && !payload.message) {
        statusEl.textContent = 'Vui lòng nhập ít nhất một thông tin.';
        return;
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          statusEl.textContent = data.message || 'Gửi thất bại.';
          return;
        }

        statusEl.textContent = data.message || 'Đã gửi thành công!';
        statusEl.className = 'ok';
        infoForm.reset();
        await loadSubmissions(true);
      } catch {
        statusEl.textContent = 'Không thể kết nối tới máy chủ.';
      } finally {
        submitBtn.disabled = false;
      }
    });

    async function loadSubmissions(keepOpen = false) {
      if (!keepOpen && listEl.classList.contains('show')) {
        listEl.classList.remove('show');
        return;
      }

      try {
        const res = await fetch('/api/submissions');
        const data = await res.json().catch(() => ({}));
        const items = Array.isArray(data.items) ? data.items : [];

        if (!items.length) {
          listEl.innerHTML = '<div class="sub-item">Chưa có thông tin nào được gửi.</div>';
        } else {
          listEl.innerHTML = items
            .map((item) => {
              const timeStr = item.createdAt
                ? new Date(item.createdAt).toLocaleString('vi-VN')
                : '';
              return `
                <div class="sub-item">
                  <div><strong>Tên:</strong> ${escapeHtml(item.name || '(trống)')}</div>
                  <div><strong>Liên hệ:</strong> ${escapeHtml(item.contact || '(trống)')}</div>
                  <div><strong>Nội dung:</strong> ${escapeHtml(item.message || '(trống)')}</div>
                  <div class="sub-meta">${escapeHtml(timeStr)}</div>
                </div>
              `;
            })
            .join('');
        }
        listEl.classList.add('show');
      } catch {
        statusEl.textContent = 'Không tải được danh sách đã gửi.';
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    viewBtn.addEventListener('click', () => loadSubmissions(false));
  </script>
</body>
